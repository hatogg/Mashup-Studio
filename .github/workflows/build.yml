name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and sign (debug key)
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MashupStudio-apk
          path: build/MashupStudio.apk
